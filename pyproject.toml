[project]
name = "disco-executors"
description = ""
authors = [{ name = "Jonas Dedden", email = "university@jonas-dedden.de" }]
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.12"

dependencies = [
    "typing_extensions",
]

[project.optional-dependencies]
dask = ["dask[distributed]"]
ray = ["ray"]

[dependency-groups]
dev = [
    "ruff>=0.5.4",
    "pytest>=8.4.0",
    "pytest-pretty>=1.2.0",
    "mypy>=1.11.0",
    "hypothesis>=6.151.10",
    "pytest-xdist>=3.8.0",
    "basedpyright>=1.40.1",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/disco"]

[tool.ruff]
line-length = 120
target-version = "py312"
fix = true
unsafe-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # ToDo
    "FIX002",
    "TD002",
    "TD003",
    # Exception formatting
    "EM",
    "TRY003",
    "BLE001", # do not catch blind exception
    # Formatting
    "E501", # line too long
    "COM812", # trailing comma
    # Docstrings
    "D",
    # Miscellaneous
    "ERA001", # commented out code
    "S101", # use of `assert`
    "ARG002", # unused args
    "C901", # too complex
    "PLR0913", # too-many-arguments
    "PLR0912", # too-many-branches
    "PLR0915", # too-many-statements
    "SLF001", # private member accessed
    "RUF023", # sorted `__slots__`
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = [
    "PLR2004", # Magic values
    "PLW0127", # Self-assignment
    "ANN401", # Allowed Any
    "FBT001", # Positional boolean
    "FBT003", # Positional boolean
]

[tool.ruff.lint.isort]
known-local-folder = ["disco.executors"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.mypy]
files = ["src", "tests"]
mypy_path = "src"
strict = true
explicit_package_bases = true

[tool.basedpyright]
include = ["src", "tests"]
# `mypy --strict` is the strict gate. Pyright's strict modes mostly flag Ray's/Dask's partially untyped APIs, so this
# runs in pyright's standard mode, as a second checker with different inference.
typeCheckingMode = "standard"
